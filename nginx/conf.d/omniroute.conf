# ==========================================
# OmniRoute Upstream & Server Definition
# ==========================================

upstream omniroute_backend {
    server omniroute:20128;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Maximum payload size for prompts, embeddings, and multimodal requests
    client_max_body_size 25M;

    # Include security response headers
    include /etc/nginx/includes/security-headers.conf;

    # ----------------------------------------------------------------------
    # 1. Health Check Endpoint (Used by Cloudflare / Docker / Load Balancers)
    # ----------------------------------------------------------------------
    location /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"omniroute-proxy"}';
    }

    # ----------------------------------------------------------------------
    # 2. Next.js Static Assets & Media (Bypasses UI rate limit, cached)
    # ----------------------------------------------------------------------
    location /_next/static/ {
        proxy_pass http://omniroute_backend;
        include /etc/nginx/includes/streaming-proxy.conf;
        expires 365d;
        access_log off;
    }

    location ~* \.(?:ico|png|svg|jpg|jpeg|gif|webp|woff|woff2|ttf|eot|css|js)$ {
        proxy_pass http://omniroute_backend;
        include /etc/nginx/includes/streaming-proxy.conf;
        expires 30d;
        access_log off;
    }

    # ----------------------------------------------------------------------
    # 3. Rewrite fallback for clients sending requests without /v1 prefix
    # ----------------------------------------------------------------------
    location ~ ^/(chat|models|embeddings|completions)(/.*)?$ {
        rewrite ^/(.*)$ /v1/$1 last;
    }

    # ----------------------------------------------------------------------
    # 4. OpenAI-Compatible API Endpoints (/v1/*) - For Cursor IDE / SDKs
    # ----------------------------------------------------------------------
    location ~ ^/v1(/.*)?$ {
        # CORS Preflight OPTIONS Handling (Electron / Browser clients)
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, X-Requested-With, User-Agent, Cache-Control, x-api-key' always;
            add_header 'Access-Control-Max-Age' 86400;
            add_header 'Content-Length' 0;
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            return 204;
        }

        # Rate Limiting & Concurrency Limits for API traffic
        limit_req zone=api_limit burst=50 nodelay;
        limit_conn addr_limit 30;

        # Apply Streaming (SSE) & WebSocket Proxying Settings
        include /etc/nginx/includes/streaming-proxy.conf;

        # Add CORS response headers for API calls
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, X-Requested-With, User-Agent, Cache-Control, x-api-key' always;

        # Forward request to OmniRoute backend
        proxy_pass http://omniroute_backend;

        # Custom JSON error responses for API clients
        error_page 429 = @api_rate_limited;
        error_page 502 503 504 = @api_gateway_error;
    }

    # ----------------------------------------------------------------------
    # 4. Web Dashboard & Management UI (Root / Dashboard / Auth)
    # ----------------------------------------------------------------------
    location / {
        # Rate Limiting for Web Dashboard & UI browsing
        limit_req zone=ui_limit burst=50 nodelay;
        limit_conn addr_limit 30;

        # Proxy parameters for Web UI & Session Cookie handling
        include /etc/nginx/includes/streaming-proxy.conf;

        proxy_pass http://omniroute_backend;
    }

    # ----------------------------------------------------------------------
    # Custom Error Handlers for API responses
    # ----------------------------------------------------------------------
    location @api_rate_limited {
        default_type application/json;
        return 429 '{"error":{"message":"Rate limit exceeded. Please throttle your requests.","type":"requests","code":"rate_limit_exceeded"}}\n';
    }

    location @api_gateway_error {
        default_type application/json;
        return 502 '{"error":{"message":"OmniRoute AI Gateway backend is currently unavailable or initializing.","type":"api_error","code":"gateway_unavailable"}}\n';
    }
}
