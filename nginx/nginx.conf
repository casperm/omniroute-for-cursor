user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
    multi_accept        on;
    use                 epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Custom log format including Cloudflare Ray ID and real client IP
    log_format  cloudflare  '$remote_addr - $remote_user [$time_local] "$request" '
                            '$status $body_bytes_sent "$http_referer" '
                            '"$http_user_agent" CF_RAY="$http_cf_ray" '
                            'rt=$request_time uct="$upstream_connect_time" '
                            'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log  /var/log/nginx/access.log  cloudflare;

    # Performance optimizations
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Security settings
    server_tokens off;

    # Real IP extraction from Cloudflare Edge
    include /etc/nginx/includes/cloudflare-real-ip.conf;

    # WebSocket Upgrade mapping
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ==========================================
    # Rate Limiting & Concurrency Zones
    # ==========================================
    # 1. API Rate Limiting Zone: 40 requests/second per client IP (for /v1/* endpoints)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=40r/s;

    # 2. General Web UI Zone: 30 requests/second per client IP (for web dashboard & page navigation)
    limit_req_zone $binary_remote_addr zone=ui_limit:10m rate=30r/s;

    # 3. Auth Brute Force Protection Zone: 30 requests/minute per client IP
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=30r/m;

    # 4. Concurrent Connection Limit Zone: tracks active connections per IP
    limit_conn_zone $binary_remote_addr zone=addr_limit:10m;

    # Return standard 429 Too Many Requests on rate limit violation
    limit_req_status 429;
    limit_conn_status 429;

    # Include virtual host configurations
    include /etc/nginx/conf.d/*.conf;
}
