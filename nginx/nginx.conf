user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
    multi_accept        on;
    use                 epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Custom log format including Cloudflare Ray ID and real client IP
    log_format  cloudflare  '$remote_addr - $remote_user [$time_local] "$request" '
                            '$status $body_bytes_sent "$http_referer" '
                            '"$http_user_agent" CF_RAY="$http_cf_ray" '
                            'rt=$request_time uct="$upstream_connect_time" '
                            'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log  /var/log/nginx/access.log  cloudflare;

    # Performance optimizations
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Security settings
    server_tokens off;

    # Real IP extraction from Cloudflare Edge
    include /etc/nginx/includes/cloudflare-real-ip.conf;

    # WebSocket Upgrade mapping
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Reject inference requests that do not present any supported API credential.
    # OmniRoute still validates the credential itself; this is only an edge pre-filter.
    map $http_authorization $has_bearer {
        default             0;
        ~*^Bearer\s+\S+$    1;
    }

    map $http_x_api_key $has_x_api_key {
        default 1;
        ""      0;
    }

    map $http_x_goog_api_key $has_x_goog_api_key {
        default 1;
        ""      0;
    }

    map $request_method $skip_api_auth {
        default 0;
        OPTIONS 1;
    }

    map "$skip_api_auth:$has_bearer:$has_x_api_key:$has_x_goog_api_key" $reject_missing_api_auth {
        default   0;
        "0:0:0:0" 1;
    }

    # ==========================================
    # Rate Limiting & Concurrency Zones
    # ==========================================
    # 1. API Rate Limiting Zone: sustained personal-use rate with short IDE bursts.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=1r/s;

    # 2. General Web UI Zone.
    limit_req_zone $binary_remote_addr zone=ui_limit:10m rate=10r/s;

    # 3. Auth brute-force protection.
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

    # 4. Concurrent connection zones: per-IP and host-wide inference ceilings.
    limit_conn_zone $binary_remote_addr zone=addr_limit:10m;
    limit_conn_zone $server_name zone=global_api_limit:10m;

    # Return standard 429 Too Many Requests on rate limit violation
    limit_req_status 429;
    limit_conn_status 429;

    # Include virtual host configurations
    include /etc/nginx/conf.d/*.conf;
}
