# =========================================================
# Streaming (SSE) & WebSocket Reverse Proxy Configuration
# =========================================================

# HTTP Version 1.1 is required for Keep-Alive and WebSockets
proxy_http_version 1.1;

# Disable proxy buffering to deliver Server-Sent Events (SSE) immediately token-by-token
proxy_buffering off;
proxy_cache off;
proxy_request_buffering off;

# Ensure chunked transfer encoding is enabled
chunked_transfer_encoding on;

# Explicitly instruct upstream and downstream proxies not to buffer
proxy_set_header X-Accel-Buffering no;

# Extended timeout settings for long-running LLM completions & reasoning models
proxy_connect_timeout 15s;
proxy_send_timeout 600s;
proxy_read_timeout 600s;
send_timeout 600s;

# WebSocket upgrade headers
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;

# Standard proxy forwarding headers
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port 443;

# Cloudflare Access identity is enforced at the edge. Unvalidated identity
# assertions are deliberately not forwarded to OmniRoute.
proxy_set_header Cf-Access-Authenticated-User-Email "";
proxy_set_header Cf-Access-Jwt-Assertion "";
